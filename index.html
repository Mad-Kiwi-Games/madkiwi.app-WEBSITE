<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mad Kiwi Games</title>
<meta name="description" content="Mad Kiwi Games — mobile game studio.">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">

<meta property="og:title" content="Mad Kiwi Games">
<meta property="og:description" content="Mobile game studio.">
<meta property="og:image" content="https://www.madkiwi.app/assets/icon-512.png">
<meta property="og:url" content="https://www.madkiwi.app/">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D0D0D;
    --green: #8CC63F;
    --green-dark: #5CA30F;
    --white: #FFFFFF;
    --grey: #A8A8A8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Montserrat', system-ui, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  h1 { margin: 0; line-height: 0; }
  .logo {
    width: min(72vw, 300px);
    height: auto;
    display: block;
  }
  footer {
    margin-top: 64px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--grey);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  footer .dot { color: var(--green); }
  footer a {
    color: var(--grey);
    text-decoration: none;
  }
  footer a:hover { color: var(--green); }
</style>
</head>
<body>
<main>
  <h1>
    <img class="logo" src="/assets/logo.png" alt="Mad Kiwi Games" width="520" height="744">
  </h1>

  <footer>
    <span>&copy; 2026 Mad Kiwi Games</span>
    <span class="dot">&#9670;</span>
    <a href="mailto:games@madkiwi.app">games@madkiwi.app</a>
    <span class="dot">&#9670;</span>
    <a href="/privacy">Privacy</a>
    <span class="dot">&#9670;</span>
    <a href="/terms">Terms</a>
    <span class="dot">&#9670;</span>
    <a href="/support">Support</a>
  </footer>
</main>
</body>
</html>
